<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Coaching — Grundimpuls</title>
  <meta name="description" content="Executive Coaching one-pager by Grundimpuls.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#F0EDE8;color:#111827;padding:40px 18px}
    .wrap{max-width:920px;margin:0 auto}
    .card{background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 22px 90px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.06)}
    .top-accent{height:4px;background:linear-gradient(90deg,#C8860A,#E07320)}
    .inner{padding:34px 32px 28px}
    .brand{display:flex;align-items:center;gap:8px;margin-bottom:26px}
    .brand img{height:46px;width:auto}
    .brand-name{font-family:'Montserrat',sans-serif;font-size:16px;letter-spacing:1.7px;text-transform:uppercase;font-weight:600;color:#111827}
    h1{font-family:'Cormorant Garamond',serif;font-size:46px;font-weight:500;line-height:1.05;margin-bottom:10px}
    .sub{font-size:14px;line-height:1.7;color:#4B5563;max-width:60ch;margin-bottom:24px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
    .btn-primary,.btn-secondary{display:inline-block;padding:13px 20px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.9px;text-decoration:none;transition:transform .15s ease,opacity .15s ease}
    .btn-primary{background:linear-gradient(135deg,#C8860A,#E07320);color:#fff;box-shadow:0 6px 24px rgba(200,134,10,.32)}
    .btn-secondary{background:#FFF8F0;color:#C8860A;border:1px solid rgba(200,134,10,.20)}
    .btn-primary:hover,.btn-secondary:hover{transform:translateY(-1px);opacity:.92}
    .pdf-frame{width:100%;height:78vh;border:0;border-top:1px solid rgba(200,134,10,.18);background:#fff}
    .note{margin-top:16px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#9CA3AF;text-align:center}
    @media (max-width:700px){h1{font-size:36px}.inner{padding:28px 22px 22px}.pdf-frame{height:68vh}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="top-accent"></div>
      <div class="inner">
        <div class="brand">
          <img src="assets/drop_light.svg" alt="Grundimpuls">
          <div class="brand-name">GRUNDIMPULS</div>
        </div>

        <h1>Executive Coaching</h1>
        <p class="sub">
          A concise overview of the Executive Coaching offer, its structure, focus, and intended outcomes.
        </p>

        <div class="actions">
          <a class="btn-primary" href="assets/pdfs/Grundimpuls_Executive_Coaching_OnePager.pdf" target="_blank" rel="noopener">Open PDF</a>
          <a class="btn-secondary" href="assets/pdfs/Grundimpuls_Executive_Coaching_OnePager.pdf" download>Download PDF</a>
        </div>
      </div>

      <iframe class="pdf-frame" src="assets/pdfs/Grundimpuls_Executive_Coaching_OnePager.pdf"></iframe>
    </div>

    <div class="note">Grundimpuls · Executive Coaching</div>
  </div>
</body>
</html>
